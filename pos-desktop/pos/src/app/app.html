@if (layout.layout() === 'sidebar') {
  <div class="shell-row d-flex" [dir]="lang.dir()" style="min-height:100vh">
    <app-sidebar />
    <div class="flex-grow-1 d-flex flex-column" style="min-width:0;min-height:100vh">
      <main class="flex-grow-1">
        <router-outlet />
      </main>
      <app-footer />
    </div>
  </div>
} @else {
  <app-header />
  <main>
    <router-outlet />
  </main>
  <app-footer />
}
